name: Backend CI

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml', 'scripts/evaluate_ds2.py', 'results/**']
  push:
    paths: ['backend/**', '.github/workflows/backend-ci.yml', 'scripts/evaluate_ds2.py', 'results/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests (dataset-dependent skips reported)
        run: python -m pytest backend/tests -ra --junitxml=/tmp/backend-tests.xml
